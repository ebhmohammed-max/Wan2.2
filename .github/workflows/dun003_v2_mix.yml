name: DUN003 v2 mix check (music fetch + VO + mix + loudness, no render)
# Trigger: bump projects/dune_archives/22_edit/DUN003/v2/mix_trigger.txt
on:
  push:
    branches: [arena/e01ea136-wan2-2]
    paths: ['projects/dune_archives/22_edit/DUN003/v2/mix_trigger.txt']
permissions:
  contents: write
concurrency: {group: dun003-v2-mix, cancel-in-progress: false}
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: {shell: 'bash -eo pipefail {0}'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: arena/e01ea136-wan2-2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet opencv-python-headless numpy pillow imageio-ffmpeg
      - name: fetch music (v1 tracks, Kevin MacLeod CC BY 4.0)
        run: |
          cd projects/dune_archives
          L=22_edit/DUN003/v2/ci_mix_log.txt; : > $L
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python tools/ci_fetch_assets.py music 2>&1 | tail -20 | tee -a $L
          ls -la 21_music/DUN003/tracks | tee -a $L
      - name: VO + mix
        run: |
          cd projects/dune_archives
          L=22_edit/DUN003/v2/ci_mix_log.txt
          python tools/v2_timeline.py --wav /tmp/vo_v2.wav 2>&1 | tail -15 | tee -a $L
          python tools/mix_music.py 21_music/DUN003/DUN003_MUSIC_EDL_v2.json /tmp/vo_v2.wav /tmp/mix_v2.wav --dur 676.53 2>&1 | tail -15 | tee -a $L
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          $FF -y -v error -i /tmp/mix_v2.wav -c:a aac -b:a 192k 22_edit/DUN003/v2/DUN003_MIX_v2.m4a
      - name: loudness
        run: |
          cd projects/dune_archives
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          $FF -hide_banner -nostats -i /tmp/mix_v2.wav -af ebur128=peak=true -f null - 2>&1 | tail -12 | tee -a 22_edit/DUN003/v2/ci_mix_log.txt
      - name: commit log + mix
        if: always()
        run: |
          git config user.name "dun003-ci"; git config user.email "dun003-ci@users.noreply.github.com"
          git add projects/dune_archives/22_edit/DUN003/v2/DUN003_MIX_v2.m4a projects/dune_archives/22_edit/DUN003/v2/ci_mix_log.txt
          git commit -m "ci: DUN003 v2 mix + loudness log" || exit 0
          ok=0; for i in 1 2 3; do git pull --rebase --autostash -q origin arena/e01ea136-wan2-2 && git push origin HEAD:arena/e01ea136-wan2-2 && { ok=1; break; }; sleep 5; done; test $ok = 1
