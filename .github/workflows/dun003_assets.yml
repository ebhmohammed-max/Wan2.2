name: DUN003 asset fetch
# Runs the jobs named in projects/dune_archives/22_edit/DUN003/ci_trigger.txt
# (stills / catalog / music) and commits the results back to this branch.
on:
  push:
    branches: [arena/e01ea136-wan2-2]
    paths: ['projects/dune_archives/22_edit/DUN003/ci_trigger.txt']
permissions:
  contents: write
concurrency: {group: dun003-assets, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: arena/e01ea136-wan2-2}
      - run: pip install --quiet pillow && (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      - name: run jobs
        run: |
          cd projects/dune_archives
          JOBS=$(head -1 22_edit/DUN003/ci_trigger.txt)
          python tools/ci_fetch_assets.py $JOBS 2>&1 | tee 22_edit/DUN003/ci_last_run.txt
      - name: commit
        run: |
          git config user.name "dun003-ci"; git config user.email "dun003-ci@users.noreply.github.com"
          git add -A projects/dune_archives
          git commit -m "ci: DUN003 assets ($(head -1 projects/dune_archives/22_edit/DUN003/ci_trigger.txt))" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin arena/e01ea136-wan2-2 && git push origin HEAD:arena/e01ea136-wan2-2 && break; sleep 5; done
